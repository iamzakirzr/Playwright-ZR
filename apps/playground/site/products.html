<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Products</title></head>
<body>
  <h1>Products</h1>
  <p data-testid="status">Loading…</p>
  <ul data-testid="products"></ul>
  <img data-testid="banner" src="/img/banner.png" alt="banner">
  <script>
    fetch("/api/products?currency=USD")
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(items => {
        const list = document.querySelector("[data-testid=products]");
        for (const item of items) {
          const li = document.createElement("li");
          li.dataset.testid = "product";
          li.textContent = `${item.name} - $${item.price.toFixed(2)}`;
          list.appendChild(li);
        }
        document.querySelector("[data-testid=status]").textContent = items.length ? `${items.length} products` : "No products";
      })
      .catch(err => { document.querySelector("[data-testid=status]").textContent = "Could not load products"; });
  </script>
</body></html>
