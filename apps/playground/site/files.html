<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Files</title></head>
<body>
  <label>Receipt <input type="file" data-testid="upload" multiple></label>
  <ul data-testid="uploaded"></ul>
  <!-- Client-side export: fetch the orders, build a CSV Blob, download it. Works in every engine
       (downloads of intercepted *network* responses are cancelled by Chromium with <a download>
       and never start in WebKit). -->
  <button data-testid="export">Download orders</button>
  <script>
    document.querySelector("[data-testid=upload]").addEventListener("change", e => {
      const list = document.querySelector("[data-testid=uploaded]");
      list.innerHTML = "";
      for (const f of e.target.files) { const li = document.createElement("li"); li.textContent = `${f.name} (${f.size} bytes)`; list.appendChild(li); }
    });
    document.querySelector("[data-testid=export]").addEventListener("click", async () => {
      const orders = await (await fetch("/api/orders")).json();
      const csv = ["id,product,quantity", ...orders.map(o => `${o.id},${o.product},${o.quantity}`)].join("\n") + "\n";
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
      link.download = "orders.csv";
      link.click();
    });
  </script>
</body></html>
