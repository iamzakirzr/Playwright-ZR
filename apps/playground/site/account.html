<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account</title></head>
<body>
  <p data-testid="greeting">Checking session…</p>
  <script>
    fetch("/api/me").then(r => r.ok ? r.json() : null).then(me => {
      const token = localStorage.getItem("token");
      document.querySelector("[data-testid=greeting]").textContent =
        me && token ? `Welcome back, ${me.username}` : "Please sign in";
    });
  </script>
</body></html>
