[pytest]
testpaths = tests
pythonpath = .
# importlib mode lets test files in different folders share a basename
addopts =
    -ra
    --strict-markers
    --import-mode=importlib
    --screenshot only-on-failure
    --tracing retain-on-failure
    --video retain-on-failure
    --output test-results
    --alluredir=reports/allure-results
markers =
    unit: framework self-tests (no browser, network or model)
    ui: browser tests through page objects
    essentials: core Playwright techniques on the local playground (network, dialogs, frames, files, auth state, emulation)
    api: HTTP tests through service clients
    sql: database tests through repositories
    hybrid: cross-layer tests (API <-> DB)
    ai: any AI / LLM test
    rag: RAG answer quality (similarity, faithfulness, production metrics)
    search: AI search / retrieval quality
    prompts: prompt engineering and prompt regression tests
    chains: prompt-chaining tests
    conversation: multi-turn conversation metrics (DeepEval ConversationalTestCase)
    langchain: a LangChain (LCEL) RAG app under test
    redteam: adversarial / safety tests
    synthesis: synthetic goldens and AI-generated test cases
    validation: LLM / GenAI output validation (determinism, budgets, hygiene)
    chat_ui: browser-driven chatbot widget tests
    agent: AI agent app under test (tool calls, multi-turn, over HTTP)
    mcp: MCP server testing
    healing: self-healing locators
    visual: visual regression testing
    bdd: Gherkin scenarios (pytest-bdd)
    mobile: any mobile test
    mobile_web: Playwright device emulation (phones/tablets)
    mobile_native: Appium native app tests (need an Appium server + device)
    live: needs a running Ollama server (auto-applied)
    judge: needs an LLM judge (auto-applied; slow on CPU)
    strong_judge: needs the opt-in >=7B judge (auto-applied)
    ragas: Ragas cross-check (needs a >=7B judge)
    smoke: fast critical-path subset
bdd_features_base_dir = tests/bdd/features
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
