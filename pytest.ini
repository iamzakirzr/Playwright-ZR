[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
markers =
    ui: browser tests through page objects
    api: HTTP tests through service clients
    sql: database tests through repositories
    hybrid: cross-layer tests (API <-> DB)
    ai: live chatbot evaluation (needs Ollama)
    ragas: Ragas cross-check (needs a >=7B judge model)
    smoke: fast critical-path subset
filterwarnings =
    ignore::DeprecationWarning
