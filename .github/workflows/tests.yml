name: tests

# Runs the functional suites (UI, API, SQL) only when a change lands on main, i.e. when a pull
# request is merged. Nothing runs on pull requests, on a schedule or by hand here: the other
# suites (lint, mobile, AI/LLM, Docker, Allure report) live in optional-suites.yml, which only
# runs when started manually from the Actions tab.
on:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-sql:
    name: API / SQL / hybrid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: ""
      - run: pytest -m "api or sql or hybrid" -n auto --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-api-sql
          path: reports/

  ui:
    name: UI + BDD (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
      - name: Run UI and BDD suites
        run: pytest -m "(ui or bdd) and not ai and not live" --browser ${{ matrix.browser }} -n auto --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-ui-${{ matrix.browser }}
          path: |
            reports/
            test-results/
