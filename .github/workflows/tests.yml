name: tests

# PR gate: hermetic suites only (no Sauce Demo / Restful Booker / live Ollama).
# Merge-to-main also runs the external UI/API suites that exercise public demo targets.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.16.9"
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  hermetic:
    name: Hermetic (unit / SQL / essentials / healing / AI offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          extras: core,apps,ai,visual
      - name: Unit + SQL + hybrid + local UI essentials + healing
        run: >
          pytest -m "(unit or sql or hybrid or essentials or healing) and not live"
          --browser chromium -n auto --junitxml=reports/junit-hermetic.xml
      - name: AI offline (no Ollama)
        run: >
          pytest -m "ai and not live and not judge and not strong_judge"
          -n auto --junitxml=reports/junit-ai-offline.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-hermetic
          path: |
            reports/
            test-results/

  api-sql:
    name: API / SQL / hybrid (external booker)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: ""
          extras: core,apps
      - run: pytest -m "api or sql or hybrid" -n auto --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-api-sql
          path: reports/

  ui:
    name: UI + BDD (${{ matrix.browser }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
          extras: core,apps,ai,visual
      - name: Run Sauce Demo UI and BDD suites
        run: pytest -m "(ui or bdd) and not ai and not live and not essentials and not healing" --browser ${{ matrix.browser }} -n auto --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-ui-${{ matrix.browser }}
          path: |
            reports/
            test-results/
