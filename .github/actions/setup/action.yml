name: Set up test environment
description: Python, optional CPU torch, project extras and the requested Playwright browsers.

inputs:
  browsers:
    description: Space-separated Playwright browsers to install ("" for none)
    default: chromium
  python-version:
    description: Python version
    default: "3.11"
  extras:
    description: Comma-separated pyproject optional-dependency extras to install
    default: "core,apps,ai,visual,mobile"
  with-torch:
    description: Install CPU-only torch before the project (needed for sentence-transformers / classifiers)
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Install Python dependencies
      shell: bash
      run: |
        if [ "${{ inputs.with-torch }}" = "true" ]; then
          pip install torch --index-url https://download.pytorch.org/whl/cpu
        fi
        # shell-escape extras: "core,apps,ai" -> ".[core,apps,ai]"
        pip install -e ".[${{ inputs.extras }}]"
    - name: Install Playwright browsers
      if: inputs.browsers != ''
      shell: bash
      run: python -m playwright install --with-deps ${{ inputs.browsers }}
