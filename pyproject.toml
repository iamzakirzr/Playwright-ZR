[project]
name = "playwright-zr"
version = "2.1.0"
description = "Layered Playwright (Python) framework: UI, API, SQL, mobile, BDD, visual and AI/LLM evaluation."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }

# Runtime dependencies are split into extras so UI-only / SQL-only work does not pull
# torch, DeepEval, Appium, etc. Install examples:
#   pip install -e ".[ui,apps]"           # Playwright UI + API clients + shop assistant app
#   pip install -e ".[ui,apps,ai,visual]" # hermetic CI / AI offline
#   pip install -e ".[all,dev]"           # full local developer setup (still needs CPU torch)
#
# `ui` is the base test-runtime extra (Playwright, pytest, pydantic, faker, Allure, BDD).
# `core` is kept as an alias of `ui` for older docs / scripts.

[project.optional-dependencies]
ui = [
    "pytest>=8.3,<10",
    "pytest-playwright>=0.7,<1",
    "pytest-xdist>=3.6,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "Faker>=30,<41",
    "allure-pytest>=2.13,<3",
    "pytest-bdd>=7,<9",
]
# Alias of `ui` (duplicate list — self-extra refs are unreliable on a fresh editable install).
core = [
    "pytest>=8.3,<10",
    "pytest-playwright>=0.7,<1",
    "pytest-xdist>=3.6,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "Faker>=30,<41",
    "allure-pytest>=2.13,<3",
    "pytest-bdd>=7,<9",
]
apps = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
]
visual = [
    "pillow>=10,<13",
]
mobile = [
    "Appium-Python-Client>=4,<7",
]
ai = [
    "deepeval>=3.0,<5",
    "ragas>=0.3,<0.5",
    # ragas 0.4.x imports a module removed in langchain-community 0.4
    "langchain-community>=0.3.27,<0.4",
    "langchain-ollama>=0.3,<2",
    "langgraph>=1.0,<2",
    "sentence-transformers>=3.0,<7",
    "evaluate>=0.4,<0.5",
    "rouge_score>=0.1.2",
    "sacrebleu>=2.4,<3",
]
dev = [
    "ruff==0.16.9",
    "pre-commit>=3.7,<5",
]
# Listed explicitly (not a self-extra) so a fresh `pip install -e ".[all]"` needs no prior install.
all = [
    "pytest>=8.3,<10",
    "pytest-playwright>=0.7,<1",
    "pytest-xdist>=3.6,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "Faker>=30,<41",
    "allure-pytest>=2.13,<3",
    "pytest-bdd>=7,<9",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "pillow>=10,<13",
    "Appium-Python-Client>=4,<7",
    "deepeval>=3.0,<5",
    "ragas>=0.3,<0.5",
    "langchain-community>=0.3.27,<0.4",
    "langchain-ollama>=0.3,<2",
    "langgraph>=1.0,<2",
    "sentence-transformers>=3.0,<7",
    "evaluate>=0.4,<0.5",
    "rouge_score>=0.1.2",
    "sacrebleu>=2.4,<3",
]

[tool.setuptools.packages.find]
include = ["ai*", "api*", "apps*", "config*", "data*", "db*", "mobile*", "pages*", "reporting*", "visual*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv", "reports", "test-results", "site/node_modules", "site/.vitepress/dist"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify, PT pytest style
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PT"]
ignore = [
    "PT011",  # broad pytest.raises: several tests assert on message text via match= instead
    "B017",   # pytest.raises(Exception) used deliberately for "any failure" guards
    "SIM105", # contextlib.suppress is less readable for learners than try/except/pass
    "PT018",  # composite asserts like `assert a and b` read naturally in these tests
    "E501",   # long lines are handled by the formatter; long strings (prompts, messages) are allowed
]

[tool.ruff.lint.isort]
known-first-party = ["ai", "api", "apps", "config", "data", "db", "mobile", "pages", "reporting", "visual"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]  # bare expressions used as readable assertions in a few places

[tool.ruff.format]
quote-style = "double"
